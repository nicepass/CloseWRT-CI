#CI项目
name: CWRT-ALL

#CI计划
on:
  #自动编译：每周一早上5点
  schedule:
    - cron: 0 21 * * 0
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

#CI权限
permissions: write-all

#CI任务
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  config:
    needs: cleanup
    name: ${{matrix.LABEL}}
    strategy:
      fail-fast: false
      #max-parallel: 4
      # 显式列举组合（而非笛卡尔积），便于为不同源码指定专用 Config：
      #  - MT7981.txt       : 24.10-6.6 专用（含 cmcc_rax3000m-nand-mtk）
      #  - MT7981-25.12.txt : 25.12 专用（25.12 无 -nand-mtk/-emmc-mtk 设备）
      #  - CPE.txt          : 两套源码共用（target 与设备在两套中一致）
      matrix:
        include:
          - CONFIG: "MT7981"
            SOURCE: "Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly"
            BRANCH: "openwrt-24.10-6.6"
            LABEL: "MT7981-24.10-6.6"
          - CONFIG: "CPE"
            SOURCE: "Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly"
            BRANCH: "openwrt-24.10-6.6"
            LABEL: "CPE-24.10-6.6"
          - CONFIG: "MT7981-25.12"
            SOURCE: "chasey-dev/immortalwrt-mt798x-rebase"
            BRANCH: "25.12"
            LABEL: "MT7981-25.12"
          - CONFIG: "CPE"
            SOURCE: "chasey-dev/immortalwrt-mt798x-rebase"
            BRANCH: "25.12"
            LABEL: "CPE-25.12"

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: CWRT
      #默认WIFI名称
      WRT_SSID: CWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
