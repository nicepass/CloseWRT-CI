#CI项目
name: CWRT-ALL

#CI计划
on:
  #自动编译：每周一早上5点
  schedule:
    - cron: 0 21 * * 0
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

#CI权限
permissions: write-all

#CI任务
jobs:
  # 只清理本 workflow（24.10）自己的产物。
  # 原先用 ophub/delete-releases-workflows 且 releases_keep_latest: 0，
  # 会删除仓库内【全部】releases —— 包括 25.12（CWRT-2512.yml）的固件。
  # 既然 25.12 已独立成 workflow，两者产物必须互不可删：
  #   24.10 的 tag 含 'Yuzhii0718-openwrt-24.10-6.6'
  #   25.12 的 tag 含 'chasey-dev-25.12'
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
    steps:
      - name: Delete old 24.10 Releases and Workflows
        run: |
          set -uo pipefail

          # 1) 只删含 'Yuzhii0718-openwrt-24.10-6.6' 的 release（含其 tag）
          gh release list --repo "$GH_REPO" --limit 200 --json tagName --jq '.[].tagName' |
            while IFS= read -r TAG; do
              case "$TAG" in
                *Yuzhii0718-openwrt-24.10-6.6*)
                  echo "deleting release: $TAG"
                  gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag || \
                    echo "warning: failed to delete $TAG"
                  ;;
              esac
            done

          # 2) 清理本 workflow 的历史 run，保留最近 3 次
          gh run list --repo "$GH_REPO" --workflow CWRT-ALL.yml \
            --limit 100 --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].databaseId' |
            while IFS= read -r RID; do
              [ -n "$RID" ] || continue
              echo "deleting run: $RID"
              gh run delete "$RID" --repo "$GH_REPO" || \
                echo "warning: failed to delete run $RID"
            done

          echo "24.10 cleanup done (25.12 releases untouched)"

  config:
    needs: cleanup
    name: ${{matrix.LABEL}}
    strategy:
      fail-fast: false
      #max-parallel: 4
      # 显式列举组合（而非笛卡尔积），便于为不同源码指定专用 Config：
      #  - 本 workflow 仅负责 24.10-6.6（与上游 VIKINGYFY/CloseWRT-CI 对齐）
      #  - 25.12 已独立到 CWRT-2512.yml，避免两者互相干扰
      #    （源码/内核/feeds/配置 均不同，失败模式也不同）
      matrix:
        include:
          - CONFIG: "MT7981"
            SOURCE: "Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly"
            BRANCH: "openwrt-24.10-6.6"
            LABEL: "MT7981-24.10-6.6"
          - CONFIG: "CPE"
            SOURCE: "Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly"
            BRANCH: "openwrt-24.10-6.6"
            LABEL: "CPE-24.10-6.6"

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: CWRT
      #默认WIFI名称
      WRT_SSID: CWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
